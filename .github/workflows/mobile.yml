name: Mobile

# 移动端独立流水线：桌面 Release 工作流（release.yml）不受影响。
#  - pull_request：改动 src/、ui/mobile/、android/、ios/、构建脚本时校验
#  - workflow_dispatch：手动触发；配置了签名 Secrets 时额外产出可安装包
on:
  pull_request:
    paths:
      - 'src/**'
      - 'ui/mobile/**'
      - 'android/**'
      - 'ios/**'
      - 'build.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==================== Android：布局单测 + Debug APK ====================
  check-android:
    runs-on: ubuntu-latest
    env:
      FFMPEG_VERSION: '7.1.1'
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      # cargo test 在宿主机（x86_64-linux）编译整个 Slint/winit 依赖图，
      # 需要 fontconfig / GL / 窗口系统等开发库；清单与 release.yml 的 Linux 构建一致。
      # nasm / xz-utils：源码编译 FFmpeg 静态库所需（见下一步）。
      - name: 安装宿主依赖（Slint/winit/fontconfig/ALSA + FFmpeg 构建工具）
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libclang-dev nasm xz-utils \
            libasound2-dev libfontconfig1-dev libdbus-1-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev

      # cargo test 在 x86_64-linux 宿主编译依赖图：ffmpeg-next 是非 optional 的 target
      # 门控依赖（Linux 命中，android/ios 排除），宿主链接因此需要 FFmpeg。apt 自带的
      # FFmpeg 6.1 与 ffmpeg-next 9.x API/符号不匹配，故与 release.yml 一致，从源码
      # 编译 7.1.1 静态库，并通过 FFMPEG_DIR 让 ffmpeg-sys-next 跳过 pkg-config。
      # 产物缓存到 /opt/ffmpeg-static，后续运行命中缓存可秒过。
      - name: 缓存 FFmpeg 静态库
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: /opt/ffmpeg-static
          key: ffmpeg-static-linux-x64-${{ env.FFMPEG_VERSION }}-v1

      - name: 编译 FFmpeg 静态库（供 cargo test 宿主链接）
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          curl -fsSL "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz" -o /tmp/ffmpeg.tar.xz
          tar -xf /tmp/ffmpeg.tar.xz -C /tmp
          cd "/tmp/ffmpeg-${FFMPEG_VERSION}"
          # --disable-autodetect：不探测任何外部库，杜绝 jack/openal/lilv/mp3lame
          #   等可选后端被带进链接（release.yml 同款防污染）；--disable-zlib/iconv 去非必要动态依赖
          ./configure \
            --prefix=/opt/ffmpeg-static \
            --enable-static --disable-shared \
            --disable-programs --disable-doc --disable-debug \
            --disable-autodetect --disable-iconv --disable-zlib \
            --enable-pic
          make -j"$(nproc)"
          make install

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 预装 Android SDK，但 sdkmanager 不在默认 PATH；显式探测其位置，
      # 加入 PATH 并暴露 ANDROID_HOME/ANDROID_SDK_ROOT，供后续 sdkmanager / gradle 步骤使用。
      - name: 配置 Android SDK 路径
        run: |
          for c in "$ANDROID_SDK_ROOT" "$ANDROID_HOME" "/usr/local/lib/android/sdk"; do
            if [ -n "$c" ] && [ -x "$c/cmdline-tools/latest/bin/sdkmanager" ]; then SDK_ROOT="$c"; break; fi
          done
          if [ -z "${SDK_ROOT:-}" ]; then echo "::error::未找到 Android SDK sdkmanager"; exit 1; fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      # 显式喂入 y 接受许可证，避免 sdkmanager 交互挂起。
      # platforms/build-tools 必装：Rust 侧的 i-slint-backend-android-activity build.rs
      # 会用 android.jar 编译 Java 辅助类并用 D8 生成 dex，缺 platforms 会直接 panic
      # “No Android platforms found”（run 45021733144）。compileSdk=35 对应 android-35。
      - name: 接受 Android SDK 许可证并安装 NDK/Platform/Build-Tools
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;27.0.12077973" "platforms;android-35" "build-tools;35.0.0"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"

      - name: 安装 cargo-ndk
        run: cargo install cargo-ndk --locked

      # 布局分类器单测在 mobile feature 下运行；但宿主 Linux 编译依赖图仍会拉入
      # ffmpeg-next，故通过 FFMPEG_DIR 指向上面编译的静态库，并显式给 bindgen 指 libclang。
      - name: Rust 单测（mobile feature）
        env:
          FFMPEG_DIR: /opt/ffmpeg-static
        run: |
          export LIBCLANG_PATH="$(find /usr/lib -maxdepth 4 -name 'libclang.so*' -print -quit | xargs -r dirname)"
          export BINDGEN_EXTRA_CLANG_ARGS="-I/usr/include -I/usr/include/x86_64-linux-gnu"
          cargo test --no-default-features --features mobile --lib --tests

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: 构建 Debug APK（Gradle 内调 cargo-ndk）
        working-directory: android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: 上传 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # ==================== iOS：无签名 Simulator 构建 ====================
  check-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate

      - name: 构建 Simulator 版本（无签名）
        working-directory: ios
        run: |
          xcodebuild \
            -project ZPlayer.xcodeproj \
            -scheme ZPlayer \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 说明（无签名，非真机安装包）
        run: echo "Simulator 构建仅用于编译校验；真机安装包需配置 iOS 签名 Secrets 后手动触发 package-ios。"

      - name: 打包 Simulator .app
        run: |
          cd ios/build/Build/Products/Release-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent ZPlayer.app ZPlayer-simulator.zip

      - name: 上传 Simulator 产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: ios/build/Build/Products/Release-iphonesimulator/ZPlayer-simulator.zip
          if-no-files-found: error

  # ==================== Android Release（需签名 Secrets）====================
  package-android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      # 与 check-android 一致：cargo-ndk 交叉编译前的宿主侧构建需要 fontconfig 等 GUI 库
      - name: 安装宿主依赖（Slint/winit/fontconfig/ALSA）
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config clang libclang-dev \
            libasound2-dev libfontconfig1-dev libdbus-1-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 预装 Android SDK，但 sdkmanager 不在默认 PATH；显式探测其位置，
      # 加入 PATH 并暴露 ANDROID_HOME/ANDROID_SDK_ROOT，供后续 sdkmanager / gradle 步骤使用。
      - name: 配置 Android SDK 路径
        run: |
          for c in "$ANDROID_SDK_ROOT" "$ANDROID_HOME" "/usr/local/lib/android/sdk"; do
            if [ -n "$c" ] && [ -x "$c/cmdline-tools/latest/bin/sdkmanager" ]; then SDK_ROOT="$c"; break; fi
          done
          if [ -z "${SDK_ROOT:-}" ]; then echo "::error::未找到 Android SDK sdkmanager"; exit 1; fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      # 显式喂入 y 接受许可证，避免 sdkmanager 交互挂起
      - name: 接受 Android SDK 许可证并安装 NDK
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;27.0.12077973"

      - name: 安装 cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: 检查签名 Secrets
        id: signing
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] \
             && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "未配置 Android 签名 Secrets，跳过 Release 签名包（Debug APK 由 check-android 产出）。"
          fi

      - name: 构建并签名 Release APK
        if: steps.signing.outputs.enabled == 'true'
        working-directory: android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.0.12077973"
          import_keystore="$RUNNER_TEMP/release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$import_keystore"
          gradle :app:assembleRelease --no-daemon --stacktrace \
            -Pandroid.injected.signing.store.file="$import_keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          rm -f "$import_keystore"

      - name: 上传 Release APK
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  # ==================== iOS Release（需签名 Secrets）====================
  package-ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    env:
      IOS_CERT_BASE64: ${{ secrets.IOS_CERT_BASE64 }}
      IOS_CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
      IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 检查签名 Secrets
        id: signing
        run: |
          if [ -n "$IOS_CERT_BASE64" ] && [ -n "$IOS_CERT_PASSWORD" ] \
             && [ -n "$IOS_PROFILE_BASE64" ] && [ -n "$IOS_TEAM_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "未配置 iOS 签名 Secrets，跳过 IPA 归档（Simulator .app 由 check-ios 产出）。"
          fi

      - name: 导入证书与描述文件
        if: steps.signing.outputs.enabled == 'true'
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          cert_path="$RUNNER_TEMP/cert.p12"
          echo "$IOS_CERT_BASE64" | base64 --decode > "$cert_path"
          security import "$cert_path" -P "$IOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychain -d user -s "$keychain"

          profile_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profile_dir"
          echo "$IOS_PROFILE_BASE64" | base64 --decode > "$profile_dir/zplayer.mobileprovision"
          rm -f "$cert_path"

      - name: 生成工程并归档
        if: steps.signing.outputs.enabled == 'true'
        working-directory: ios
        run: |
          xcodegen generate
          xcodebuild \
            -project ZPlayer.xcodeproj \
            -scheme ZPlayer \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/ZPlayer.xcarchive \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            archive

      - name: 导出 IPA
        if: steps.signing.outputs.enabled == 'true'
        working-directory: ios
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$IOS_TEAM_ID</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/ZPlayer.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist

      - name: 上传 IPA
        if: steps.signing.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ios/build/export/*.ipa
          if-no-files-found: error
