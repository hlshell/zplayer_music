<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="theme-color" content="#14121c" />
  <title>ZPlayer Web</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: #14121c;
      color: #e8e6f0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #zplayer-root { width: 100%; height: 100vh; }
    canvas#canvas { width: 100%; height: 100vh; display: block; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <noscript>此应用需要启用 JavaScript 才能运行。</noscript>
  <script>
    // JSONP：用于绕过 music-api.gdstudio.xyz 的 CORS 限制（浏览器 fetch 被拦，
    // 但 <script> 标签天然跨域）。gdmusic 已实测支持 ?callback=xxx 返回 fn({json})。
    // 调用方（wasm）通过 window.__zplayer_jsonp(url) 拿到 Promise<data>。
    window.__zplayer_jsonp = function (url) {
      return new Promise(function (resolve, reject) {
        var cbName = '__zpcb_' + Date.now() + '_' + Math.floor(Math.random() * 1e9);
        var timer = null;
        var script = null;

        function cleanup() {
          if (timer) { clearTimeout(timer); timer = null; }
          if (script && script.parentNode) { script.parentNode.removeChild(script); }
          try { delete window[cbName]; } catch (e) { window[cbName] = undefined; }
        }

        window[cbName] = function (data) { resolve(data); cleanup(); };

        script = document.createElement('script');
        script.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + cbName;
        script.onerror = function () { reject(new Error('jsonp_network')); cleanup(); };
        document.head.appendChild(script);

        timer = setTimeout(function () { reject(new Error('jsonp_timeout')); cleanup(); }, 15000);
      });
    };
  </script>
  <script type="module">
    import init from "./zplayer-music.js?v=20261025F";
    init()
      .catch((e) => {
        // winit 在 Slint web 启动时有一次 "Using exceptions for control flow" 控制流信号，
        // 是正常机制，不是错误；忽略它，其余错误才显示。
        if (String(e).includes("Using exceptions for control flow")) {
          console.info("ZPlayer web 已启动（winit 控制流信号，可忽略）");
          return;
        }
        console.error("ZPlayer wasm 初始化失败:", e);
        const el = document.createElement("div");
        el.style.cssText = "position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#f88;font-size:14px";
        el.textContent = "初始化失败，请检查控制台：" + String(e);
        document.body.appendChild(el);
      });
  </script>
</body>
</html>
